# ---------------------------------------------------------------------------
#  BabyTracker TV — настройки сборки
# ---------------------------------------------------------------------------

# АДРЕС ДАШБОРДА. Единственное, что обычно нужно менять.
# Значение попадает в BuildConfig.DASHBOARD_URL, исходники трогать не нужно.
#
# bt.nuanu.ai — домен ЧЕРЕЗ CLOUDFLARE, и это принципиально: прямой путь до IP
# сервера у части провайдеров режется (крупные ответы обрываются на ~11-20 КБ,
# JS-бандл дашборда на 265 КБ не доезжал). Через Cloudflare тот же файл приходит
# целиком за доли секунды. Второй домен, bt.adbgw.ru, смотрит прямо на IP и
# оставлен вебхуку Алисы — ТЕЛЕВИЗОР ТУДА ХОДИТЬ НЕ ДОЛЖЕН.
#
# Локальный адрес тоже годится: localhost/127.0.0.1 указывают на сам телевизор
# и не работают, нужен LAN-адрес машины с сервером (`ipconfig getifaddr en0`).
#
# Разово, без правки файла:  ./gradlew assembleDebug -PDASHBOARD_URL=http://192.168.1.42:8787/
DASHBOARD_URL=https://bt.nuanu.ai/

# HTTP Basic, которым закрыт дашборд на Caddy. Пусто = аутентификации нет
# (локальная разработка без Caddy продолжает работать).
#
# НАСТОЯЩИЙ ПАРОЛЬ СЮДА НЕ ПИШЕМ — файл в git. Передавайте при сборке:
#   ./gradlew assembleDebug -PDASHBOARD_USER=tv -PDASHBOARD_PASSWORD='…'
# либо положите обе строки в ~/.gradle/gradle.properties (он вне репозитория).
DASHBOARD_USER=
DASHBOARD_PASSWORD=

# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
