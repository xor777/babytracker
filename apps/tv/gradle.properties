# ---------------------------------------------------------------------------
#  BabyTracker TV — настройки сборки
# ---------------------------------------------------------------------------

# АДРЕС ДАШБОРДА. Единственное, что обычно нужно менять.
# Значение попадает в BuildConfig.DASHBOARD_URL, исходники трогать не нужно.
#
# Это должен быть адрес, доступный С ТЕЛЕВИЗОРА: localhost/127.0.0.1 указывают
# на сам телевизор и работать не будут. Нужен LAN-адрес машины с сервером
# (`ipconfig getifaddr en0` на macOS) либо публичный https-адрес туннеля.
#
# Разово, без правки файла:  ./gradlew assembleDebug -PDASHBOARD_URL=http://192.168.1.42:8787/
DASHBOARD_URL=http://192.168.1.10:8787/

# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
